name: main

env:
  ROS_DISTRO: lyrical

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    container: ros:lyrical
    strategy:
      fail-fast: false
      matrix:
        rmw: [rmw_zenoh_cpp, rmw_fastrtps_cpp]
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: '^1.24.3'
          check-latest: true

      - name: Install additional tools and libraries
        run: |
          apt-get update
          apt-get install -y \
            make \
            ros-lyrical-action-msgs \
            ros-lyrical-example-interfaces \
            ros-lyrical-test-msgs \
            ros-lyrical-rmw-zenoh-cpp \
            ros-lyrical-rmw-fastrtps-cpp

      - name: Run tests
        shell: bash
        run: |
          # Source the ROS environment so LD_LIBRARY_PATH, AMENT_PREFIX_PATH,
          # CMAKE_PREFIX_PATH, etc. are set. GitHub Actions runs steps without
          # the image's ros_entrypoint.sh, so this is not set automatically.
          source /opt/ros/${ROS_DISTRO}/setup.bash
          # On rmw_zenoh_cpp, make test starts and stops its own Zenoh router.
          make test RMW_IMPLEMENTATION=${{ matrix.rmw }}

  run-linter:
    runs-on: ubuntu-latest
    container: ros:lyrical
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: '^1.24.3'
          check-latest: true

      - name: Prepare environment
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            ros-lyrical-action-msgs \
            ros-lyrical-example-interfaces \
            ros-lyrical-test-msgs
          # Source ROS so golangci-lint can compile the cgo packages (it runs
          # the C compiler but not the binaries).
          source /opt/ros/${ROS_DISTRO}/setup.bash
          # Export the variables the linter needs to subsequent steps. Listed
          # explicitly rather than dumping all of env, which would corrupt
          # $GITHUB_ENV with the multi-line shell functions sourcing ROS exports.
          {
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
            echo "AMENT_PREFIX_PATH=${AMENT_PREFIX_PATH}"
            echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
            echo "PYTHONPATH=${PYTHONPATH}"
            echo "PATH=${PATH}"
          } >> "$GITHUB_ENV"

      - uses: golangci/golangci-lint-action@v9
